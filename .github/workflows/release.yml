name: release
# Push to the `release` branch to publish a release. The version is the one in the VERSION file,
# so bump it (and merge main into release) for each release. The workflow builds the desktop app
# for macOS (Apple silicon and Intel) and Linux (x86-64), signs an update manifest with the release
# key, and publishes everything as a GitHub release. Installed apps find it through update.json.
# See docs/releasing.md.
on:
  push:
    branches: [release]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.RELAY_UPDATE_SIGNING_KEY }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "::error::VERSION must look like 1.2.3 (got '$VERSION')"; exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already released. Bump VERSION, then push to release again."; exit 1
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The RELAY_UPDATE_SIGNING_KEY secret is not set, so the update manifest cannot be signed."; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  rdp-client:
    # The remote desktop client (WebAssembly) is built once and shared by every platform build.
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install wasm-pack
        run: which wasm-pack >/dev/null 2>&1 || cargo install --version 0.15.0 wasm-pack --locked
      - run: make rdp-client
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rdp-client
          path: desktop/frontend/vendor
          if-no-files-found: error

  build:
    needs: [prepare, rdp-client]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: darwin-arm64, os: macos-latest, goos: darwin, arch: arm64 }
          - { name: darwin-amd64, os: macos-latest, goos: darwin, arch: amd64 }
          - { name: linux-amd64, os: ubuntu-22.04, goos: linux, arch: amd64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rdp-client
          path: desktop/frontend/vendor
      - name: Install Linux build libraries
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - run: npm ci
        working-directory: desktop/frontend

      - name: Build and package (macOS)
        if: matrix.goos == 'darwin'
        working-directory: desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          CGO_CFLAGS: -mmacosx-version-min=13.0
          CGO_LDFLAGS: -mmacosx-version-min=13.0
        run: |
          wails3 task darwin:package ARCH=${{ matrix.arch }}
          mv bin/relay.app bin/Relay.app
          # Show the release version in Finder and About, then sign again (editing the plist breaks the signature).
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" -c "Set :CFBundleVersion $APP_VERSION" bin/Relay.app/Contents/Info.plist
          codesign --force --deep --sign - bin/Relay.app
          codesign --verify --deep --strict bin/Relay.app
          lipo -archs bin/Relay.app/Contents/MacOS/relay | grep -qx "$([ '${{ matrix.arch }}' = amd64 ] && echo x86_64 || echo arm64)"
          ditto -c -k --keepParent bin/Relay.app "Relay-${{ matrix.name }}.zip"

      - name: Build and package (Linux)
        if: matrix.goos == 'linux'
        working-directory: desktop
        run: |
          wails3 task linux:build
          tar -czf "Relay-${{ matrix.name }}.tar.gz" -C bin relay

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Relay-${{ matrix.name }}
          path: desktop/Relay-${{ matrix.name }}.*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELAY_UPDATE_SIGNING_KEY: ${{ secrets.RELAY_UPDATE_SIGNING_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: desktop/go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Relay-*
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "Relay $VERSION"
            echo
            git log --no-merges --pretty='- %s' ${PREV:+"$PREV..HEAD"} | head -50
          } > notes.md
      - name: Sign the update manifest
        working-directory: desktop
        run: |
          go run ./cmd/mkupdate -version "$VERSION" -notes-file ../notes.md -out ../dist/update.json \
            darwin/arm64=../dist/Relay-darwin-arm64.zip \
            darwin/amd64=../dist/Relay-darwin-amd64.zip \
            linux/amd64=../dist/Relay-linux-amd64.tar.gz
      - name: Publish the release
        run: |
          (cd dist && sha256sum Relay-* > SHA256SUMS)
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Relay $VERSION" --notes-file notes.md --latest
