name: ironrdp-update
# Weekly check for new Devolutions/IronRDP release tags. The client is built from a pinned git tag
# (desktop/rdp-client/ironrdp.pin), which Dependabot cannot bump. This workflow looks up the latest
# release tag, updates the pin (tag, commit and the Rust version that release asks for), rebuilds the
# client, runs the full verification gate, and opens a pull request for human review. Never auto-merge.
on:
  schedule:
    - cron: '0 5 * * 1' # Weekly Monday at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CGO_CFLAGS: -mmacosx-version-min=13.0
      CGO_LDFLAGS: -mmacosx-version-min=13.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: jetli/wasm-pack-action@0d673aca0fb86c757c3e1e21b06f8c7d62057d39 # v0.4.0
        with:
          version: 'v0.13.1'
      - name: Check for new IronRDP release
        id: check_release
        run: |
          # The newest release tag of the web client package, the commit it points to, and the Rust it pins.
          REPO=https://github.com/Devolutions/IronRDP
          LATEST_TAG=$(git ls-remote --tags "$REPO" 'refs/tags/npm-iron-remote-desktop-rdp-v*' | awk '{print $2}' | sed 's#refs/tags/##; s#\^{}##' | sort -uV | tail -1)
          if [ -z "$LATEST_TAG" ]; then echo "No release tag found"; exit 0; fi
          CURRENT_TAG=$(sed -n 's/^tag=//p' desktop/rdp-client/ironrdp.pin)
          echo "Current: $CURRENT_TAG, Latest: $LATEST_TAG"
          if [ "$LATEST_TAG" != "$CURRENT_TAG" ]; then
            COMMIT=$(git ls-remote "$REPO" "refs/tags/$LATEST_TAG^{}" | awk '{print $1}')
            [ -n "$COMMIT" ] || COMMIT=$(git ls-remote "$REPO" "refs/tags/$LATEST_TAG" | awk '{print $1}')
            RUST=$(curl -fsSL "https://raw.githubusercontent.com/Devolutions/IronRDP/$COMMIT/rust-toolchain.toml" | sed -n 's/^channel *= *"\(.*\)"/\1/p')
            [ -n "$COMMIT" ] && [ -n "$RUST" ] || { echo "could not resolve commit or toolchain for $LATEST_TAG"; exit 1; }
            sed -i '' -e "s/^tag=.*/tag=$LATEST_TAG/" -e "s/^commit=.*/commit=$COMMIT/" -e "s/^rust=.*/rust=$RUST/" desktop/rdp-client/ironrdp.pin
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Run verification gate
        if: steps.check_release.outputs.updated == 'true'
        run: |
          make rdp-client
          npm ci --prefix desktop/frontend
          make desktop-check
      - name: Open Pull Request
        if: steps.check_release.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f # v7.0.5
        with:
          commit-message: "chore(deps): bump IronRDP to ${{ steps.check_release.outputs.latest_tag }}"
          title: "Update IronRDP to ${{ steps.check_release.outputs.latest_tag }}"
          body: |
            Automated weekly check detected a new release of `Devolutions/IronRDP`: `${{ steps.check_release.outputs.latest_tag }}`.
            
            All verification gates passed:
            - WebAssembly rebuild (`make rdp-client`)
            - Desktop gate (`make desktop-check`)
            
            ⚠️ **Human review required before merge**: Protocol library updates must never be auto-merged. Please inspect the IronRDP release notes.
          branch: "update-ironrdp-${{ steps.check_release.outputs.latest_tag }}"
          base: main
          delete-branch: true
