# Weekly update pull requests, so a fixed dependency or Go release reaches the project without anyone
# having to remember to look. Actions are pinned by commit, so Dependabot is what keeps them current.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /desktop
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /desktop/frontend
    schedule: { interval: weekly }
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # svelte-check's --tsgo mode needs TypeScript 6 installed next to the 7 alias
      # (@typescript/native); moving "typescript" itself to 7 breaks `npm run check`.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /desktop/rdp-wasm
    schedule: { interval: weekly }
    groups:
      rdp-wasm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
