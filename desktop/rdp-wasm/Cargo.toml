[package]
name = "relay-rdp-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "WebAssembly client wrapper for IronRDP in Relay"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = { version = "0.1", optional = true }
iron-remote-desktop = "0.7.1"
ironrdp-web = { git = "https://github.com/Devolutions/IronRDP", tag = "v0.3.0" }

[features]
default = ["console_error_panic_hook"]
