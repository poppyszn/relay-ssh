name: desktop
# The Relay desktop app is built and tested on macOS only for now. It runs only when
# something the app is made of changes, because macOS minutes cost ten times as much,
# plus a weekly schedule to catch new security advisories on unchanged dependencies.
on:
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday at 04:00 UTC
  push:
    branches: [main]
    paths:
      - desktop/**
      - internal/**
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - desktop/**
      - internal/**
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/desktop.yml

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CGO_CFLAGS: -mmacosx-version-min=13.0
      CGO_LDFLAGS: -mmacosx-version-min=13.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
        working-directory: desktop/frontend
      # The Rust toolchain itself is installed by `make rdp-client` (the version in desktop/rdp-client/ironrdp.pin).
      - uses: jetli/wasm-pack-action@0d673aca0fb86c757c3e1e21b06f8c7d62057d39 # v0.4.0
        with:
          version: 'v0.15.0' # keep equal to wasm_pack in desktop/rdp-client/ironrdp.pin
      - run: make desktop-check
      # The RDP client must still build from its pinned release.
      - run: make rdp-client
      # Known vulnerabilities: production npm packages, Rust dependencies, and desktop module.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: desktop/frontend
      - name: Audit Rust dependencies
        # Audits the IronRDP client we ship (not IronRDP's whole workspace); see the script for what it accepts and why.
        run: which cargo-audit >/dev/null 2>&1 || cargo install --version 0.22.2 cargo-audit --locked; ./desktop/scripts/audit-ironrdp.sh
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: desktop
