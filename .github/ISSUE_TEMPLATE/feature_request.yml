name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Relay to do?
    validations:
      required: true
  - type: textarea
    id: ssh
    attributes:
      label: Can OpenSSH already do this?
      description: Relay generates standard OpenSSH config, so features that are just a config line are cheap. Say if this is one.
